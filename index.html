<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSRStudio v2 — Industrial Guided AI Video Framework</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <!-- SSRStudio v2 Modular Studio CSS -->
  <link rel="stylesheet" href="/web/css/studio.css">
</head>
<body>

  <!-- Top Navigation & Mode Switcher -->
  <header class="studio-header">
    <div class="studio-brand">
      <span style="font-size: 1.5rem;">🎬</span>
      <div>
        <div class="studio-logo-text">SSRSTUDIO v2</div>
        <div style="font-size: 0.65rem; font-family: var(--font-mono); color: var(--text-dim); letter-spacing: 0.05em;">
          INDUSTRIAL AI VIDEO PIPELINE
        </div>
      </div>
      <span class="studio-version-tag">STABLE 2.0</span>
    </div>

    <!-- Mode Switcher -->
    <div class="mode-switcher">
      <button type="button" class="mode-btn active" id="btn-mode-guided">
        <span>✨ 導演引導模式</span>
        <span style="opacity: 0.7; font-size: 0.72rem;">(Guided Mode)</span>
      </button>
      <button type="button" class="mode-btn" id="btn-mode-tactical">
        <span>🎛️ 專家戰術控制台</span>
        <span style="opacity: 0.7; font-size: 0.72rem;">(Pro Tactical)</span>
      </button>
    </div>

    <!-- Right Status & Project Selector -->
    <div class="header-status">
      <select id="header-project-select" class="wizard-select" style="padding: 0.3rem 0.8rem; font-size: 0.78rem; width: auto;">
        <option value="">載入專案清單中...</option>
      </select>

      <div class="sse-badge">
        <span class="sse-dot" id="sse-status-dot"></span>
        <span id="sse-status-text">SSE CONNECTING</span>
      </div>
    </div>
  </header>

  <!-- Main Studio Workspace -->
  <main class="studio-main">
    
    <!-- Guided Mode View (Guided Director Wizard) -->
    <section id="view-wizard-container" style="display: block; margin-bottom: 2rem;">
      <!-- Populated by GuidedWizard component -->
    </section>

    <!-- Pro Tactical Mode Canvases (Radar + Prop Pre-comp) -->
    <section id="view-tactical-canvases" class="grid-2" style="display: none; margin-bottom: 2rem;">
      <div id="tactical-radar-container"></div>
      <div id="tactical-prop-container"></div>
    </section>

    <!-- Backlot Multi-Shot Board & 4 Approval Gates -->
    <section id="view-backlot-container">
      <!-- Populated by BacklotBoard component -->
    </section>

  </main>

  <!-- Global Toast Notification -->
  <div id="studio-toast" class="toast"></div>

  <!-- Zero-Build Vanilla ES Module Entry Point -->
  <script type="module" src="/web/js/app.js"></script>
</body>
</html>
